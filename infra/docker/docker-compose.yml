name: home-media

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [app]

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [app]

  api:
    build:
      context: ../../apps/api
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [app, media]

  worker:
    build:
      context: ../../apps/api
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [app, media]

  jellyfin:
    image: jellyfin/jellyfin:latest
    restart: unless-stopped
    profiles: [media]
    environment:
      TZ: ${TZ}
    ports:
      - "${JELLYFIN_BIND_ADDRESS}:8096:8096"
    volumes:
      - ${CONFIG_ROOT}/jellyfin:/config
      - ${MEDIA_ROOT}/library:/media:ro
    networks: [media]

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    restart: unless-stopped
    profiles: [media]
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${CONFIG_ROOT}/prowlarr:/config
    ports:
      - "127.0.0.1:9696:9696"
    networks: [media]

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    restart: unless-stopped
    profiles: [media]
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${CONFIG_ROOT}/radarr:/config
      - ${MEDIA_ROOT}:/data
    ports:
      - "127.0.0.1:7878:7878"
    networks: [media]

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    restart: unless-stopped
    profiles: [media]
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${CONFIG_ROOT}/sonarr:/config
      - ${MEDIA_ROOT}:/data
    ports:
      - "127.0.0.1:8989:8989"
    networks: [media]

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    restart: unless-stopped
    profiles: [media]
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${CONFIG_ROOT}/lidarr:/config
      - ${MEDIA_ROOT}:/data
    ports:
      - "127.0.0.1:8686:8686"
    networks: [media]

  gluetun:
    image: qmcgaw/gluetun:latest
    restart: unless-stopped
    profiles: [media]
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: ${NORDVPN_SERVICE_PROVIDER}
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: ${NORDVPN_PRIVATE_KEY}
      SERVER_COUNTRIES: ${NORDVPN_COUNTRIES}
    ports:
      - "127.0.0.1:8080:8080"
    networks: [media]

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    network_mode: service:gluetun
    restart: unless-stopped
    profiles: [media]
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      WEBUI_PORT: 8080
    volumes:
      - ${CONFIG_ROOT}/qbittorrent:/config
      - ${MEDIA_ROOT}:/data
    depends_on: [gluetun]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  # Services are protected by publishing only explicitly required ports; these
  # networks must retain outbound access for Telegram/Gemini, indexers, and the
  # Gluetun tunnel.
  app: {}
  media: {}

volumes:
  postgres_data:
  redis_data:
